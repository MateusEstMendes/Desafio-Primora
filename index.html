<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/primora-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Inteligência Multi-tenant — Primora & Distribuidora Vetor</title>
    <!-- Google Fonts: Plus Jakarta Sans (usada por empresas modernas de tech como Primora) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primora-purple: #684cb1;
        --primora-purple-dark: #533898;
        --primora-cyan: #0ed5fa;
        --primora-cyan-dark: #09b8d9;
        --primora-dark: #141f2b;
        --primora-dark-surface: #1f2d3d;
        --primora-gradient: linear-gradient(135deg, #684cb1 0%, #0ed5fa 100%);
        --primora-gradient-h: linear-gradient(90deg, #684cb1 0%, #0ed5fa 100%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        color: #1e293b;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Estilização moderna de scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Utilitários Primora */
      .primora-gradient-text {
        background: linear-gradient(135deg, #684cb1 0%, #0ed5fa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .primora-card {
        border: 1px solid rgba(226, 232, 240, 0.8) !important;
        box-shadow: 0 4px 20px -2px rgba(104, 76, 177, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02) !important;
        border-radius: 12px !important;
        transition: transform 0.2s ease, box-shadow 0.2s ease !important;
      }

      .primora-card:hover {
        box-shadow: 0 10px 25px -3px rgba(104, 76, 177, 0.1), 0 4px 10px -2px rgba(14, 213, 250, 0.05) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
