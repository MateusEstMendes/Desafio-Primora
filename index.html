<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <script>
      try {
        const savedTheme = localStorage.getItem('color-scheme') || 'light';
        document.documentElement.dataset.theme = savedTheme;
        document.querySelector('meta[name="color-scheme"]').content = savedTheme;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/primora-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Painel Executivo Multi-Tenant — Distribuidora Vetor | Primora</title>
    <!-- Tipografia em Três Vozes (DESIGN.md):
         1. Serif Display (Weight 300 Editorial): Cormorant Garamond / Playfair Display
         2. Neo-Grotesque Sans (UI & Subheads): Inter (Weights 300, 400, 500, 600)
         3. Technical Monospace (Uppercase Labels & Data): Roboto Mono (Weights 400, 500) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark light;

        /* DESIGN.md Tokens — Blue & Bright Blue Edition (No Purple) */
        --color-blue-gleam: #2970ff;
        --color-bright-blue: #3b82f6;
        --color-cyan-signal: #00b3dd;
        --color-pale-blue: #bae6fd;
        --color-deep-blue: #1d4ed8;
        --color-sky-bloom: #38bdf8;
        --color-periwinkle: #90b8f0;

        /* Neutral & Gallery Surfaces */
        --color-obsidian: #0f1011;
        --color-abyss: #090a0b;
        --color-graphite: #2e2e2e;
        --color-steel: #3f4041;
        --color-silver: #cacaca;
        --color-fog: #6a6b6b;
        --color-ash: #9f9fa0;
        --color-cloud: #f5f5f7;
        --color-pure: #ffffff;
        --color-void: #000000;

        /* Typography Families */
        --font-lyon-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        --font-suisse-intl: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-suisse-intl-trial: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-roboto-mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

        accent-color: var(--color-blue-gleam);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        background-color: var(--bg-canvas, #0f1011);
        color: var(--text-primary, #ffffff);
        font-family: var(--font-suisse-intl);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Elevação Flat por Camadas de Superfície (DESIGN.md: Sem drop-shadows em cards) */
      .ant-card,
      .ant-select-selector,
      .ant-table,
      .ant-tag,
      .ant-alert {
        box-shadow: none !important;
        text-shadow: none !important;
      }

      /* Números Tabulares e Lining Figures (Límpidos, Alinhados e Sem Deformações Antigas) */
      .tabular-nums,
      .ant-statistic-content,
      .ant-table-cell,
      table td,
      table th,
      .metric-value,
      .kpi-ledger-number,
      .funnel-mini-stat-val,
      .donut-center-value,
      .client-tab-score,
      .client-mini-score-val,
      .account-ledger-val,
      .exec-item-metric-val {
        font-family: var(--font-suisse-intl) !important;
        font-variant-numeric: tabular-nums lining-nums !important;
        font-feature-settings: "tnum" 1, "lnum" 1 !important;
      }

      /* Transições rápidas e eliminação do delay de 300ms de duplo toque (touch-action) */
      button,
      a,
      input,
      select,
      .touch-target,
      .flat-interactive,
      .ant-btn,
      .ant-select-selector,
      .ant-radio-button-wrapper {
        touch-action: manipulation;
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, opacity 0.2s ease !important;
      }

      /* Prevenção de Auto-Zoom em campos de formulário no Safari iOS (mínimo 16px) */
      @media (max-width: 767px) {
        input,
        select,
        textarea,
        .ant-input,
        .ant-select-selection-item {
          font-size: 16px !important;
        }
      }

      /* Eliminação de outline, bordas de seleção e tap-highlight em gráficos Recharts */
      .recharts-responsive-container,
      .recharts-responsive-container *,
      .recharts-wrapper,
      .recharts-wrapper *,
      .recharts-surface,
      .recharts-surface *,
      .recharts-layer,
      .recharts-layer * {
        outline: none !important;
        box-shadow: none !important;
        -webkit-tap-highlight-color: transparent !important;
        -webkit-touch-callout: none !important;
        user-select: none !important;
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
      }

      .recharts-wrapper:focus,
      .recharts-wrapper:focus-visible,
      .recharts-wrapper:focus-within,
      .recharts-surface:focus,
      .recharts-surface:focus-visible,
      svg.recharts-surface:focus,
      svg.recharts-surface:focus-visible,
      .recharts-wrapper svg:focus,
      .recharts-wrapper svg:focus-visible,
      svg:focus,
      svg:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }

      /* Tabela Responsiva */
      .table-region-wrapper {
        overflow: auto;
        max-inline-size: 100%;
        container-type: inline-size;
        border: 1px solid var(--border-default);
        border-radius: 16px;
        background-color: var(--bg-surface);
      }

      .table-region-wrapper:focus-visible {
        outline: 2px solid var(--color-blue-gleam);
        outline-offset: 2px;
      }

      @media (forced-colors: active) {
        .flat-card,
        .ant-card,
        .table-region-wrapper {
          border: 1px solid CanvasText !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
