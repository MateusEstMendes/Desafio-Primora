<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content =
          localStorage.getItem('color-scheme') ?? 'light';
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/primora-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Executivo Multi-Tenant — Distribuidora Vetor | Primora</title>
    <!-- Tipografia Técnica e Limpa: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* MANDATORY: Apply color-scheme to :root for viewport-wide theming */
        color-scheme: light dark;

        --primora-purple-light: #684cb1;
        --primora-purple-dark: #8b6fd4;
        --primora-cyan-light: #0891b2;
        --primora-cyan-dark: #0ed5fa;

        --bg-canvas: light-dark(#f4f6f9, #0d151e);
        --bg-surface: light-dark(#ffffff, #141f2b);
        --bg-subtle: light-dark(#eef2f6, #1b2938);
        --border-default: light-dark(#d5dce6, #263648);
        --text-primary: light-dark(#0f172a, #f1f5f9);
        --text-secondary: light-dark(#334155, #cbd5e1);
        --text-muted: light-dark(#64748b, #94a3b8);

        accent-color: light-dark(var(--primora-purple-light), var(--primora-purple-dark));
      }

      :root:has(> head > meta[name="color-scheme"][content="dark"]) {
        color-scheme: dark;
      }

      :root:has(> head > meta[name="color-scheme"][content="light"]) {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ESTRITO FLAT DESIGN: Proibido sombras, chanfros, relevos ou desfoques */
      *,
      *::before,
      *::after,
      .ant-card,
      .ant-btn,
      .ant-select-selector,
      .ant-select-dropdown,
      .ant-table,
      .ant-tag,
      .ant-alert,
      .ant-drawer-content-wrapper,
      .ant-popover-inner,
      .ant-tooltip-inner {
        box-shadow: none !important;
        text-shadow: none !important;
        backdrop-filter: none !important;
      }

      /* Números Tabulares obrigatórios para métricas, tabelas e indicadores */
      .tabular-nums,
      .ant-statistic-content,
      .ant-table-cell,
      table td,
      table th,
      .metric-value {
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;
      }

      /* Transições funcionais curtas (100-150ms) apenas em estados interativos */
      button,
      .flat-interactive,
      .ant-btn,
      .ant-select-selector,
      .ant-radio-button-wrapper {
        transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease !important;
      }

      /* Tabela Responsiva com Sticky Headers e Container Queries */
      .table-region-wrapper {
        overflow: auto;
        max-inline-size: 100%;
        container-type: inline-size;
        border: 1px solid var(--border-default);
        border-radius: 4px;
        background-color: var(--bg-surface);
      }

      .table-region-wrapper:focus-visible {
        outline: 2px solid light-dark(#684cb1, #8b6fd4);
        outline-offset: 1px;
      }

      /* Suporte a Forced Colors Mode (Acessibilidade de Alto Contraste) */
      @media (forced-colors: active) {
        .flat-surface,
        .ant-card,
        .table-region-wrapper {
          border: 1px solid CanvasText !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
